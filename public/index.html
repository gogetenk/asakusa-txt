      glyph = lv<.06? 0 : cs(11, clamp(int(lv*11.+hs*5.),0,15));
    } else if(mat==14){      // fire / embers flicker
      glyph = lv<.06? 0 : cs(14, clamp(int(lv*12.+hash12(vec2(cell)+floor(uTime*12.))*4.),0,15));
    } else if(mat==6 && abs(ny)<.35){  // lacquered pillars: vertical strokes
      glyph=cs(19,lvl);
    } else glyph=cs(mat,lvl);
    fg=vivid(avg,lv);
    if(mat==4) fg=mix(vec3(lum(fg)),fg,.6)*.78;   // moss: muted, never neon
  }
  // ---- glow: blurred emissive at cell resolution
  vec3 gw=dec(texelFetch(uGlow,cell,0).rgb);
  float gl=lum(gw);
  if(glyph==0 && gl*uBloomAscii>.035){ glyph=cs(18,int(clamp((gl*uBloomAscii-.035)*5.,0.,1.)*15.99)); fg=vivid(gw,clamp(gl*2.5,.2,1.)); }
  fg+=gw*.3; bg+=gw*.14;
  // boot reveal: cells resolve from the top down through a band of flickering vermilion letters
  if(uReveal<1.){
    float rv=hash12(vec2(cell)*.37+3.1)*.55+(1.-float(cell.y)/float(uCells.y))*.45;
    float e=rv-uReveal*1.12;
    if(e>0.){
      if(e<.1){ glyph=cs(16,int(hash12(vec2(cell)+floor(uTime*14.))*15.99)); fg=vec3(1.,.36,.2)*(1.-e*8.); bg=vec3(.05,.01,.01); emi=.6; }
      else { glyph=0; fg=vec3(0.); bg=vec3(0.); emi=0.; }
    }
  }
  c0=vec4(min(fg,vec3(1.2)), float(glyph)/255.);
  c1=vec4(min(bg,vec3(1.)), clamp(emi*1.3,0.,1.));
  c2=vec4(float(mat)/255., floor(dc*255.)/255., fract(dc*255.), 0.);
}`;

// ── final composite: glyph atlas + overlay (HUD, particles, signs) + halo
const FS_DISPLAY = `#version 300 es
${GLSL_COMMON}
uniform sampler2D uC0,uC1,uC2,uAtlas,uGlow,uO0,uO1,uU0,uU1,uAtlasUI;
uniform vec2 uCellPx, uOff, uScreen; uniform ivec2 uCells; uniform float uTime, uHalo, uFade;
out vec4 o;
void main(){
  vec2 fc=gl_FragCoord.xy-uOff, gp=vec2(uCells)*uCellPx;
  vec2 uvg=fc/gp;
  vec3 col=vec3(0.);
  if(fc.x>=0.&&fc.y>=0.&&fc.x<gp.x&&fc.y<gp.y){
    ivec2 cp=ivec2(uCellPx), cell=ivec2(fc)/cp, ip=ivec2(fc)-cell*cp;
    vec4 a=texelFetch(uC0,cell,0), b=texelFetch(uC1,cell,0);
    int g=int(a.a*255.+.5); vec3 fg=a.rgb, bg=b.rgb; float hal=b.a;
    vec4 oa=texelFetch(uO0,cell,0); int oc=int(oa.r*255.+.5);
    if(oc>0){
      int fl=int(oa.a*255.+.5); vec4 cc=texelFetch(uC2,cell,0);
      float od=oa.g+oa.b/255., sd=cc.g+cc.b/255.;
      bool vis=(fl&1)!=0 || od<=sd+.003;
      if((fl&4)!=0) vis=vis && int(cc.r*255.+.5)==5;
      if(vis){
        vec4 ob=texelFetch(uO1,cell,0);
        fg=ob.rgb; hal=max(hal,ob.a);
        if((fl&2)!=0) bg=fg*.10+vec3(.004,.004,.01);
        g=oc-32;
      }
    }
    ivec2 at=ivec2((g%16)*cp.x+ip.x, (g/16)*cp.y+(cp.y-1-ip.y));
    vec2 m=texelFetch(uAtlas,at,0).rg;
    col=bg+fg*m.r+fg*m.g*hal*.5;
    // coarse layer (2×2 fine cells): legible text, HUD, panels
    ivec2 up=cp*2, ucell=ivec2(fc)/up, uip=ivec2(fc)-ucell*up;
    vec4 ua=texelFetch(uU0,ucell,0); int uc=int(ua.r*255.+.5);
    if(uc>0){
      int fl=int(ua.a*255.+.5); vec4 cc=texelFetch(uC2,cell,0);
      float od=ua.g+ua.b/255., sd=cc.g+cc.b/255.;
      if((fl&1)!=0 || od<=sd+.003){
        vec4 ub=texelFetch(uU1,ucell,0); int ug=uc-32;
        ivec2 uat=ivec2((ug%16)*up.x+uip.x, (ug/16)*up.y+(up.y-1-uip.y));
        vec2 um=texelFetch(uAtlasUI,uat,0).rg;
        vec3 base=(fl&2)!=0 ? ub.rgb*.10+vec3(.004,.004,.01) : col*.3;
        col=base+ub.rgb*um.r+ub.rgb*um.g*ub.a*.85;
      }
    }
  }
  col+=dec(texture(uGlow,clamp(uvg,0.,1.)).rgb)*uHalo;
  vec2 q=gl_FragCoord.xy/uScreen-.5; col*=1.-dot(q,q)*.6;
  col*=uFade;
  col+=(hash12(gl_FragCoord.xy+fract(uTime*7.)*91.)-.5)*.01;
  o=vec4(pow(max(col,0.),vec3(.95)),1.);
}`;

// ───────────────────────── renderer ─────────────────────────
// scene (G-buffer, 3×5 samples per cell) → reflection → emissive glow → ASCII cells → glyph composite
const CHARSETS = [
  /* 0 SKY     */ "     ..''`^*+",
  /* 1 STONE   */ "   .,:;;+*%#@",
  /* 2 ASPHALT */ "   ..,,:;=+*#",
  /* 3 GRAVEL  */ "  .,:;;:i!lI",
  /* 4 GRASS   */ " .,'|/\\\"",
  /* 5 WATER   */ "  .-~=~=*",
  /* 6 WOOD    */ "  .:-=+=#H#",
  /* 7 ROOF    */ "  .-:=mMW#",
  /* 8 PAPER   */ " .:oO0@@@",
  /* 9 NEON    */ " .:+*#%@",
  /* 10 FACADE */ "  .,:;i!|lI[#",
  /* 11 FOLIAGE*/ " .:;o0OQ@8&%#",
  /* 12 METAL  */ "  .:-=+#[]#",
  /* 13 CLOTH  */ "  .:-=+*#%@@",
  /* 14 FIRE   */ " .'^*%#@",
  /* 15 GLASS  */ "  .:[]#=|#",
  /* 16 neon letters  */ "ABCDEFGHKMNRSTXZ",
  /* 17 window text   */ "$#@&%abdkpqwzQW0",
  /* 18 glow ramp     */ " ..,,::;;'''**",
  /* 19 pillar strokes*/ "  .:|||I[]H#",
];
const EDGE_GLYPHS = "|/\\_-()'.,[]";

class Renderer {
  constructor(canvas) {
    this.cv = canvas;
    const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
    if (!gl) throw new Error('WebGL2 unavailable');
    this.gl = gl;
    this.SX = 3; this.SY = 5;
    this.P = {
      scene: glProgram(gl, VS_SCENE, FS_SCENE, 'scene'),
      sky: glProgram(gl, VS_FULL, FS_SKY, 'sky'),
      emit: glProgram(gl, VS_FULL, FS_EMIT, 'emit'),
      blur: glProgram(gl, VS_FULL, FS_BLUR, 'blur'),
      ascii: glProgram(gl, VS_FULL, FS_ASCII, 'ascii'),
      disp: glProgram(gl, VS_FULL, FS_DISPLAY, 'display'),
    };
    this.vaoEmpty = gl.createVertexArray();
    // character sets → R8 texture (16 levels × rows)
    const cs = new Uint8Array(16 * 24);
    CHARSETS.forEach((s, r) => { for (let i = 0; i < 16; i++) cs[r * 16 + i] = G(s[Math.min(s.length - 1, Math.floor(i / 16 * s.length))]); });
    this.csTex = glTex(gl, 16, 24, { ifmt: gl.R8, fmt: gl.RED, data: cs });
    this.edge = new Int32Array(24); this.edgeN = EDGE_GLYPHS.length;
    for (let i = 0; i < this.edgeN; i++) this.edge[i] = G(EDGE_GLYPHS[i]);
    this.meshes = [];
    this.LP = new Float32Array(MAXL * 4); this.LC = new Float32Array(MAXL * 4); this.NL = 0;
    this.rip = new Float32Array(32);
    this.params = { expo: 1.3, halo: 0.55, bloomAscii: 1.0, wet: 0.7, fog: 0.012, fade: 1, reveal: 1, rain: 0 };
    this.time = 0;
    this.blackTex = glTex(gl, 1, 1, { data: new Uint8Array([0, 0, 0, 255]) });
  }

  // ── geometry
  upload(mesh, dynamic = false) {
    const gl = this.gl, vao = gl.createVertexArray(), vbo = gl.createBuffer();
    gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mesh.d), dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
    const st = 48;
    [[0, 3, 0], [1, 3, 12], [2, 3, 24], [3, 3, 36]].forEach(([l, n, o]) => { gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, n, gl.FLOAT, false, st, o); });
    gl.bindVertexArray(null);
    const obj = { vao, vbo, count: mesh.count, model: M4.ident(), visible: true, reflect: true };
    this.meshes.push(obj);
    return obj;
  }

  // split a big static mesh into spatial chunks (grid on x/z) so off-screen parts are skipped
  uploadChunked(mesh, size = 14) {
    const buckets = new Map(), d = mesh.d;
    for (let i = 0; i < d.length; i += 36) {
      const cx = (d[i] + d[i + 12] + d[i + 24]) / 3, cz = (d[i + 2] + d[i + 14] + d[i + 26]) / 3;
      const key = Math.floor(cx / size) + ',' + Math.floor(cz / size);
      let b = buckets.get(key); if (!b) buckets.set(key, b = []);
      for (let k = 0; k < 36; k++) b.push(d[i + k]);
    }
    const out = [];
    for (const arr of buckets.values()) {
      const bb = [1e9, 1e9, 1e9, -1e9, -1e9, -1e9];
      for (let i = 0; i < arr.length; i += 12) for (let a = 0; a < 3; a++) { bb[a] = Math.min(bb[a], arr[i + a]); bb[a + 3] = Math.max(bb[a + 3], arr[i + a]); }
      const m = this.upload({ d: arr, count: arr.length / 12 });
      m.bb = bb; out.push(m);
    }
    return out;
  }
  _frustum(vp) {
    const r = k => [vp[k], vp[4 + k], vp[8 + k], vp[12 + k]], R0 = r(0), R1 = r(1), R2 = r(2), R3 = r(3);
    const P = [];
    for (const [a, sgn] of [[R0, 1], [R0, -1], [R1, 1], [R1, -1], [R2, 1], [R2, -1]]) P.push([R3[0] + sgn * a[0], R3[1] + sgn * a[1], R3[2] + sgn * a[2], R3[3] + sgn * a[3]]);
    return P;
  }
  _visible(bb, mirror) {
    const F = this._fr; if (!F || !bb) return true;
    const y0 = mirror ? -bb[4] : bb[1], y1 = mirror ? -bb[1] : bb[4];
    for (const p of F) {
      const x = p[0] > 0 ? bb[3] : bb[0], y = p[1] > 0 ? y1 : y0, z = p[2] > 0 ? bb[5] : bb[2];
      if (p[0] * x + p[1] * y + p[2] * z + p[3] < 0) return false;
    }
    return true;
  }

  // ── sizing: integer device-pixel cells, glyph atlas rebuilt at that exact size
  // Two grids: a fine one for the scene (detail) and a coarse one, exactly 2×2 fine cells, for
  // everything that must stay legible (signs, HUD, dialogs). Both are even-sized so they align.
  resize(cssW, cssH, dpr, cellCssH, fontFamily) {
    const gl = this.gl;
    const W = Math.round(cssW * dpr), H = Math.round(cssH * dpr);
    this.cv.width = W; this.cv.height = H;
    const ch = Math.max(7, Math.round(cellCssH * dpr));
    const fontPx = Math.round(ch * 0.82);
    const mc = document.createElement('canvas').getContext('2d');
    const font = `500 ${fontPx}px ${fontFamily}`;
    mc.font = font;
    const cw = Math.max(4, Math.round(mc.measureText('M').width * 1.02));
    this.cellPx = [cw, ch]; this.font = font;
    this.cols = Math.floor(W / cw) & ~1; this.rows = Math.floor(H / ch) & ~1;
    this.uiCols = this.cols / 2; this.uiRows = this.rows / 2;
    this.off = [Math.floor((W - this.cols * cw) / 2), Math.floor((H - this.rows * ch) / 2)];
    this.W = W; this.H = H; this.dpr = dpr;
    this.aspect = (this.cols * cw) / (this.rows * ch);
    const SX = this.SX, SY = this.SY;
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    const pack = at => { const rg = new Uint8Array(at.W * at.H * 2); for (let i = 0; i < at.W * at.H; i++) { rg[i * 2] = at.alpha[i]; rg[i * 2 + 1] = at.blur[i]; } return rg; };
    const at = buildAtlas(cw, ch, font, SX, SY);
    if (this.atlasTex) gl.deleteTexture(this.atlasTex);
    this.atlasTex = glTex(gl, at.W, at.H, { ifmt: gl.RG8, fmt: gl.RG, data: pack(at) });
    if (this.shapeTex) gl.deleteTexture(this.shapeTex);
    this.shapeTex = glTex(gl, 95, at.NS, { ifmt: gl.R8, fmt: gl.RED, data: at.shapeN });
    const uat = buildAtlas(cw * 2, ch * 2, `500 ${Math.round(ch * 2 * 0.82)}px ${fontFamily}`, 1, 1);
    if (this.uiAtlasTex) gl.deleteTexture(this.uiAtlasTex);
    this.uiAtlasTex = glTex(gl, uat.W, uat.H, { ifmt: gl.RG8, fmt: gl.RG, data: pack(uat) });
    // targets
    [this.tG, this.tR, this.tE, this.tB1, this.tB2, this.tC].forEach(t => glFree(gl, t));
    this.gw = this.cols * SX; this.gh = this.rows * SY;
    this.tG = glTarget(gl, this.gw, this.gh, 2, { depth: true });
    this.tR = glTarget(gl, Math.ceil(this.gw * 0.5), Math.ceil(this.gh * 0.5), 2, { depth: true, linear: [true, false] });
    this.tE = glTarget(gl, this.cols, this.rows, 1, { linear: [true] });
    this.tB1 = glTarget(gl, this.cols, this.rows, 1, { linear: [true] });
    this.tB2 = glTarget(gl, this.cols, this.rows, 1, { linear: [true] });
    this.tC = glTarget(gl, this.cols, this.rows, 3);
    [this.ovA, this.ovB, this.uiA, this.uiB].forEach(t => t && gl.deleteTexture(t));
    this.ovA = glTex(gl, this.cols, this.rows); this.ovB = glTex(gl, this.cols, this.rows);
    this.uiA = glTex(gl, this.uiCols, this.uiRows); this.uiB = glTex(gl, this.uiCols, this.uiRows);
  }

  // ── camera
  setCamera(pos, target, fovY, far = 260) {
    const view = M4.lookAt(pos, target, [0, 1, 0]);
    const proj = M4.persp(fovY, this.aspect, 0.3, far);
    this.cam = { pos, target, fovY, far, view, proj, vp: M4.mul(proj, view) };
    const f = V3.norm(V3.sub(target, pos)), r = V3.norm(V3.cross(f, [0, 1, 0])), u = V3.cross(r, f);
    this.cam.fwd = f; this.cam.right = r; this.cam.up = u;
    const ty = Math.tan(fovY / 2); this.cam.tan = [ty * this.aspect, ty];
  }
  // world point → cell coords (x,y from top-left) + depth
  project(p) {
    const c = M4.proj(this.cam.vp, p);
    if (c[3] <= 0.01) return null;
    const nx = c[0] / c[3], ny = c[1] / c[3];
    return { x: (nx * 0.5 + 0.5) * this.cols, y: (1 - (ny * 0.5 + 0.5)) * this.rows, d: V3.len(V3.sub(p, this.cam.pos)) / this.cam.far };
  }

  setLights(list) {
    // nearest lights to the camera target win
    const t = this.cam.target;
    const sorted = list.filter(l => l.i > 0.001).map(l => [l, (l.p[0] - t[0]) ** 2 + (l.p[2] - t[2]) ** 2 - l.r * l.r * 2]).sort((a, b) => a[1] - b[1]);
    this.NL = Math.min(MAXL, sorted.length);
    for (let k = 0; k < this.NL; k++) {
      const l = sorted[k][0];
      this.LP.set([l.p[0], l.p[1], l.p[2], l.r], k * 4);
      this.LC.set([l.c[0] * l.i, l.c[1] * l.i, l.c[2] * l.i, 0], k * 4);
    }
  }

  _drawScene(mirror, target) {
    const gl = this.gl, P = this.P, c = this.cam, pr = this.params;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
    gl.viewport(0, 0, target.w, target.h);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    // sky
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(P.sky.p);
    const su = P.sky.u;
    gl.uniform3fv(su.uFwd, c.fwd); gl.uniform3fv(su.uRight, c.right); gl.uniform3fv(su.uUp, c.up);
    gl.uniform3fv(su.uMoon, this.moon); gl.uniform2fv(su.uTan, c.tan); gl.uniform2f(su.uRes, target.w, target.h);
    gl.uniform1f(su.uMirror, mirror); gl.uniform1f(su.uTime, this.time); gl.uniform1f(su.uRain, pr.rain || 0);
    gl.bindVertexArray(this.vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // geometry
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.depthFunc(gl.LEQUAL);
    gl.useProgram(P.scene.p);
    const u = P.scene.u;
    gl.uniformMatrix4fv(u.uVP, false, c.vp);
    gl.uniform3fv(u.uCam, c.pos); gl.uniform1f(u.uTime, this.time); gl.uniform1f(u.uMirror, mirror);
    gl.uniform1f(u.uFar, c.far); gl.uniform1f(u.uWet, pr.wet); gl.uniform1f(u.uFog, pr.fog);
    gl.uniform2f(u.uRes, target.w, target.h);
    gl.uniform4fv(u.uLP, this.LP); gl.uniform4fv(u.uLC, this.LC); gl.uniform1i(u.uNL, this.NL);
    gl.uniform3fv(u.uMoon, this.moon); gl.uniform3fv(u.uFogC, this.fogC);
    gl.uniform3fv(u.uAmbTop, this.ambTop); gl.uniform3fv(u.uAmbBot, this.ambBot);
    gl.uniform4fv(u.uRip, this.rip); gl.uniform4fv(u.uOcc, this.occ || [0, 0, 0, 0]);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, mirror ? this.blackTex : this.tR.tex[0]);
    gl.uniform1i(u.uRefl, 0);
    this._fr = this._frustum(c.vp);
    for (const m of this.meshes) {
      if (!m.visible || (mirror && !m.reflect)) continue;
      if (!this._visible(m.bb, mirror)) continue;
      gl.uniformMatrix4fv(u.uModel, false, m.model);
      gl.bindVertexArray(m.vao); gl.drawArrays(gl.TRIANGLES, 0, m.count);
    }
    gl.bindVertexArray(null);
  }

  _full(prog, target, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
    gl.viewport(0, 0, w, h);
    gl.bindVertexArray(this.vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  _tex(unit, tex, loc) { const gl = this.gl; gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); }

  render(overlay, ui) {
    const gl = this.gl, P = this.P, pr = this.params;
    gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
    this._drawScene(1, this.tR);
    this._drawScene(0, this.tG);
    gl.disable(gl.DEPTH_TEST);
    // emissive → cell res
    gl.useProgram(P.emit.p); this._tex(0, this.tG.tex[0], P.emit.u.uG0); gl.uniform2i(P.emit.u.uS, this.SX, this.SY);
    this._full(P.emit, this.tE, this.cols, this.rows);
    // separable blur ×2 (wide glow)
    gl.useProgram(P.blur.p); gl.uniform2f(P.blur.u.uSize, this.cols, this.rows);
    let src = this.tE;
    [[2, 0], [0, 2], [4.4, 0], [0, 4.4]].forEach((d, i) => {
      const dst = i % 2 ? this.tB2 : this.tB1;
      this._tex(0, src.tex[0], P.blur.u.uT); gl.uniform2f(P.blur.u.uDir, d[0], d[1]);
      this._full(P.blur, dst, this.cols, this.rows); src = dst;
    });
    // ASCII
    gl.useProgram(P.ascii.p); const au = P.ascii.u;
    this._tex(0, this.tG.tex[0], au.uG0); this._tex(1, this.tG.tex[1], au.uG1);
    this._tex(2, this.tB2.tex[0], au.uGlow); this._tex(3, this.shapeTex, au.uShape); this._tex(4, this.csTex, au.uCS);
    gl.uniform2i(au.uS, this.SX, this.SY); gl.uniform1f(au.uTime, this.time); gl.uniform1f(au.uExpo, pr.expo);
    gl.uniform1f(au.uBloomAscii, pr.bloomAscii); gl.uniform1f(au.uDetail, 2); gl.uniform1f(au.uReveal, pr.reveal ?? 1); gl.uniform2i(au.uCells, this.cols, this.rows);
    gl.uniform1iv(au.uEdge, this.edge); gl.uniform1i(au.uEdgeN, this.edgeN);
    this._full(P.ascii, this.tC, this.cols, this.rows);
    // overlay upload
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.bindTexture(gl.TEXTURE_2D, this.ovA); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.cols, this.rows, gl.RGBA, gl.UNSIGNED_BYTE, overlay.a);
    gl.bindTexture(gl.TEXTURE_2D, this.ovB); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.cols, this.rows, gl.RGBA, gl.UNSIGNED_BYTE, overlay.b);
    gl.bindTexture(gl.TEXTURE_2D, this.uiA); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.uiCols, this.uiRows, gl.RGBA, gl.UNSIGNED_BYTE, ui.a);
    gl.bindTexture(gl.TEXTURE_2D, this.uiB); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.uiCols, this.uiRows, gl.RGBA, gl.UNSIGNED_BYTE, ui.b);
    // display
    gl.useProgram(P.disp.p); const du = P.disp.u;
    this._tex(0, this.tC.tex[0], du.uC0); this._tex(1, this.tC.tex[1], du.uC1); this._tex(2, this.tC.tex[2], du.uC2);
    this._tex(3, this.atlasTex, du.uAtlas); this._tex(4, this.tB2.tex[0], du.uGlow);
    this._tex(5, this.ovA, du.uO0); this._tex(6, this.ovB, du.uO1);
    this._tex(7, this.uiA, du.uU0); this._tex(8, this.uiB, du.uU1); this._tex(9, this.uiAtlasTex, du.uAtlasUI);
    gl.uniform2fv(du.uCellPx, this.cellPx); gl.uniform2fv(du.uOff, this.off); gl.uniform2f(du.uScreen, this.W, this.H);
    gl.uniform2i(du.uCells, this.cols, this.rows); gl.uniform1f(du.uTime, this.time); gl.uniform1f(du.uHalo, pr.halo); gl.uniform1f(du.uFade, pr.fade);
    this._full(P.disp, null, this.W, this.H);
  }
}

// ───────────────────────── overlay (HUD, particles, signs) ─────────────────────────
// One character per cell, drawn over the scene. flags: 1 always on top, 2 solid background, 4 only over water
class Overlay {
  resize(cols, rows) {
    this.cols = cols; this.rows = rows;
    this.a = new Uint8Array(cols * rows * 4); this.b = new Uint8Array(cols * rows * 4);
    this.z = new Float32Array(cols * rows);
  }
  clear() { this.a.fill(0); this.z.fill(9); }
  put(x, y, ch, col, d = 0, flags = 1, glow = 0) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= this.cols || y >= this.rows) return;
    const code = typeof ch === 'number' ? ch : ch.charCodeAt(0);
    if (code <= 32 && !(flags & 2)) return;
    const i = (this.rows - 1 - y) * this.cols + x;
    if (!(flags & 1) && d > this.z[i]) return;
    this.z[i] = (flags & 1) ? -1 : d;
    const dd = Math.min(0.99999, Math.max(0, d)) * 255;
    const A = this.a, B = this.b, j = i * 4;
    A[j] = Math.max(32, code); A[j + 1] = Math.floor(dd); A[j + 2] = Math.floor((dd % 1) * 255); A[j + 3] = flags;
    B[j] = Math.min(255, col[0] * 255); B[j + 1] = Math.min(255, col[1] * 255); B[j + 2] = Math.min(255, col[2] * 255); B[j + 3] = Math.min(255, glow * 255);
  }
  text(x, y, s, col, d = 0, flags = 1, glow = 0) { for (let i = 0; i < s.length; i++) this.put(x + i, y, s[i], col, d, flags, glow); }
  vtext(x, y, s, col, d = 0, flags = 1, glow = 0) { for (let i = 0; i < s.length; i++) this.put(x, y + i, s[i], col, d, flags, glow); }
  // filled box with an ASCII border
  box(x, y, w, h, col, bcol, style = 0) {
    const bc = bcol || col;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const edgeY = j === 0 || j === h - 1, edgeX = i === 0 || i === w - 1;
      let c = ' ';
      if (edgeY && edgeX) c = style ? '+' : '.';
      else if (edgeY) c = style ? '-' : (j === 0 ? '-' : '-');
      else if (edgeX) c = '|';
      this.put(x + i, y + j, c, bc, 0, 3, 0);
    }
  }
}

// ───────────────────────── particles: rain, splashes, leaves ─────────────────────────
// Particles live in world space and are drawn as single characters in the overlay,
// depth-tested against the scene so they pass behind buildings.
class FX {
  constructor() { this.p = []; this.rip = []; this.rainAcc = 0; this.leafAcc = 0; }
  spawn(o) { if (this.p.length < 2400) this.p.push(o); }
  // incense smoke from the jokoro: slow, curling, warm at the base, grey as it rises
  smoke(src, rate, dt, pull) {
    this.smokeAcc = (this.smokeAcc || 0) + dt * rate;
    while (this.smokeAcc > 1) {
      this.smokeAcc--;
      const R = Math.random;
      this.spawn({ k: 4, x: src[0] + (R() - 0.5) * 0.9, y: src[1], z: src[2] + (R() - 0.5) * 0.9, vx: (R() - 0.5) * 0.3, vy: 0.55 + R() * 0.35, vz: (R() - 0.5) * 0.3, life: 5 + R() * 3, max: 8, ph: R() * 6.28, pull });
    }
  }
  // fireworks: a rocket climbs, then bursts into sparks. type: 0 peony, 1 chrysanthemum (trails), 2 willow (gold, drooping), 3 ring
  firework(from, at, col, type, onBurst) {
    this.spawn({ k: 5, x: from[0], y: from[1], z: from[2], tx: at[0], ty: at[1], tz: at[2], life: 1.6, max: 1.6, col, type, onBurst });
  }
  _burst(q) {
    const R = Math.random, n = q.type === 3 ? 70 : q.type === 2 ? 110 : 140, sp = q.type === 2 ? 28 : 40 + R() * 9;
    const ax = R() * 6.28;
    for (let i = 0; i < n; i++) {
      let dx, dy, dz;
      if (q.type === 3) { const a = i / n * 6.28; dx = Math.cos(a); dy = Math.sin(a) * Math.cos(ax); dz = Math.sin(a) * Math.sin(ax); }
      else { const u = R() * 2 - 1, a = R() * 6.28, r = Math.sqrt(1 - u * u); dx = r * Math.cos(a); dy = u; dz = r * Math.sin(a); }
      const v = sp * (q.type === 3 ? 1 : 0.75 + R() * 0.25);
      const c = (q.type === 1 && R() < 0.3) ? [1, 0.95, 0.85] : q.col;
      this.spawn({ k: 6, x: q.x, y: q.y, z: q.z, vx: dx * v, vy: dy * v, vz: dz * v, life: (q.type === 2 ? 3.4 : 2.3) + R() * 0.7, max: 2.9, col: c, type: q.type, tw: R() * 6.28 });
    }
    if (q.onBurst) q.onBurst(q);
  }
  update(dt, t, env) {
    const c = env.center, R = Math.random;
    // rain
    this.rainAcc += dt * env.rain * 1500;
    while (this.rainAcc > 1) {
      this.rainAcc--;
      this.spawn({ k: 0, x: c[0] + (R() - 0.5) * 22, y: 1 + R() * 13, z: c[2] - 34 + R() * 40, vx: -2.2, vy: -19 - R() * 5, vz: 0.6, life: 2 });
    }
    // falling leaves around the trees
    this.leafAcc += dt * env.leaves * 7;
    while (this.leafAcc > 1) {
      this.leafAcc--;
      const tr = env.trees[(R() * env.trees.length) | 0];
      if (!tr) break;
      this.spawn({ k: 2, x: tr[0] + (R() - 0.5) * 4, y: 3.5 + R() * 3, z: tr[2] + (R() - 0.5) * 4, vx: 0, vy: -0.7 - R() * 0.5, vz: 0, life: 14, ph: R() * 6.28, col: tr[3], spin: 2 + R() * 3 });
    }
    const keep = [];
    for (const q of this.p) {
      q.life -= dt;
      if (q.k === 0) {
        q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
        if (q.y <= 0) {
          q.k = 1; q.y = 0.02; q.life = 0.28;
          if (env.isWater && env.isWater(q.x, q.z) && this.rip.length < 8 && R() < 0.25) this.rip.push([q.x, q.z, 0, 0.8]);
        }
      } else if (q.k === 2) {
        q.ph += dt * q.spin;
        q.x += (Math.sin(q.ph) * 0.9 + env.wind) * dt; q.z += Math.cos(q.ph * 0.7) * 0.4 * dt;
        q.y += q.vy * dt;
        if (q.y <= 0.03) { q.y = 0.03; q.k = 3; q.life = 8 + R() * 6; }
      }
      else if (q.k === 4) {
        q.ph += dt * 0.9;
        const age = q.max - q.life;
        q.x += (q.vx + Math.sin(q.ph + age) * 0.35 + env.wind * 0.15 * age) * dt;
        q.z += (q.vz + Math.cos(q.ph * 1.3) * 0.25) * dt;
        q.y += q.vy * dt * (1 - age * 0.06);
        if (q.pull) { q.x += (q.pull[0] - q.x) * dt * 0.8; q.z += (q.pull[2] - q.z) * dt * 0.8; q.y += (q.pull[1] - q.y) * dt * 0.3; }
      } else if (q.k === 5) {
        const t = 1 - q.life / q.max, e = 1 - (1 - t) * (1 - t);
        q.px = q.x; q.py = q.y; q.pz = q.z;
        q.cx = q.x; q.cy = q.y; q.cz = q.z;
        if (q.sx === undefined) { q.sx = q.x; q.sy = q.y; q.sz = q.z; }
        q.x = q.sx + (q.tx - q.sx) * t; q.y = q.sy + (q.ty - q.sy) * e; q.z = q.sz + (q.tz - q.sz) * t;
        if (q.life <= 0) this._burst(q);
        if (R() < 0.6) this.spawn({ k: 7, x: q.x, y: q.y, z: q.z, life: 0.5, max: 0.5 });
      } else if (q.k === 6) {
        const drag = q.type === 2 ? 1.6 : 1.1;
        q.vx -= q.vx * drag * dt; q.vy -= (q.vy * drag + (q.type === 2 ? 7 : 4.5)) * dt; q.vz -= q.vz * drag * dt;
        q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
        if ((q.type === 1 || q.type === 2) && R() < 0.22) this.spawn({ k: 7, x: q.x, y: q.y, z: q.z, life: 0.7, max: 0.7, col: q.col });
      } else if (q.k === 7) { q.y -= dt * 1.5; }
      if (q.life > 0) keep.push(q);
    }
    this.p = keep;
    // ripples age
    for (const r of this.rip) r[2] += dt;
    this.rip = this.rip.filter(r => r[2] < 1.4);
  }
  _drawSpark(ov, rend, q, mirror) {
    const s = rend.project([q.x, mirror ? -q.y : q.y, q.z]);
    if (!s) return;
    const f = Math.max(0, Math.min(1, q.life / (q.max * 0.55)));
    let ch, c, g;
    if (q.k === 5) { ch = '|'; c = [1, 0.85, 0.5]; g = 0.6; }
    else if (q.k === 7) { ch = q.life > 0.35 ? ':' : '.'; c = (q.col || [1, 0.7, 0.4]).map(v => v * 0.5 * f); g = 0.1; }
    else {
      const tw = 0.75 + 0.25 * Math.sin(q.tw + q.life * 30);
      ch = f > 0.75 ? '*' : f > 0.45 ? '+' : f > 0.2 ? '\'' : '.';
      if (q.type === 2) ch = f > 0.6 ? '*' : f > 0.3 ? '|' : ':';
      c = q.col.map(v => Math.min(1, v * (0.35 + 0.75 * f) * tw)); g = 0.9 * f;
    }
    if (mirror) { c = c.map(v => v * 0.62); g *= 0.5; ov.put(s.x, s.y, ch === '|' ? '|' : ch, c, 0, 5, g); }
    else ov.put(s.x, s.y, ch, c, s.d, 0, g);
  }
  addRipple(x, z, s = 1) { if (this.rip.length >= 8) this.rip.shift(); this.rip.push([x, z, 0, s]); }
  writeRipples(arr) {
    arr.fill(0);
    this.rip.forEach((r, i) => { arr[i * 4] = r[0]; arr[i * 4 + 1] = r[1]; arr[i * 4 + 2] = r[2]; arr[i * 4 + 3] = r[3]; });
  }
  draw(ov, rend, t) {
    for (const q of this.p) {
      const s = rend.project([q.x, q.y, q.z]);
      if (!s) continue;
      if (q.k === 0) {
        const s2 = rend.project([q.x - q.vx * 0.045, q.y - q.vy * 0.045, q.z - q.vz * 0.045]);
        if (!s2) continue;
        const dx = s.x - s2.x, dy = s.y - s2.y;
        const ch = Math.abs(dx) < Math.abs(dy) * 0.3 ? '|' : (dx * dy > 0 ? '\\' : '/');
        const a = 0.35 + 0.25 * Math.sin(q.x * 9.1 + q.z * 3.3);
        ov.put(s.x, s.y, ch, [0.55 * a + 0.2, 0.68 * a + 0.24, 0.95 * a + 0.3], s.d, 0, 0.05);
        if (Math.abs(dy) > 1.6) ov.put(s2.x, s2.y, ch, [0.28, 0.34, 0.5], s2.d, 0, 0);
      } else if (q.k === 1) {
        const ch = q.life > 0.18 ? '.' : q.life > 0.08 ? 'o' : '\'';
        ov.put(s.x, s.y, ch, [0.5, 0.6, 0.78], s.d - 0.001, 0, 0);
      } else if (q.k === 2) {
        const seq = '-\\|/';
        const ch = q.col === 1 ? '*' : seq[Math.floor(q.ph * 1.3) & 3];
        const c = q.col === 1 ? [1, 0.28, 0.1] : [1, 0.78, 0.18];
        ov.put(s.x, s.y, ch, c, s.d - 0.001, 0, 0.15);
      } else if (q.k === 4) {
        const age = q.max - q.life, f = Math.min(1, q.life / 2) * Math.min(1, age * 2);
        const ch = age < 1 ? '.' : age < 2.5 ? (Math.sin(q.ph) > 0 ? '(' : ')') : age < 4.5 ? '~' : (Math.sin(q.ph * 2) > 0 ? 'S' : '~');
        const warm = Math.max(0, 1 - age * 0.6);
        ov.put(s.x, s.y, ch, [(0.42 + 0.5 * warm) * f, (0.4 + 0.18 * warm) * f, (0.46 - 0.2 * warm) * f], s.d - 0.002, 0, 0.1 * f);
      } else if (q.k === 5 || q.k === 6 || q.k === 7) {
        this._drawSpark(ov, rend, q, false);
        if (q.k !== 7) this._drawSpark(ov, rend, q, true);
      } else if (q.k === 3) {
        const f = Math.min(1, q.life / 3);
        const c = q.col === 1 ? [0.7 * f, 0.2 * f, 0.07 * f] : [0.7 * f, 0.55 * f, 0.12 * f];
        ov.put(s.x, s.y, q.col === 1 ? '*' : ',', c, s.d - 0.001, 0, 0);
      }
    }
  }
}

// ───────────────────────── world: Asakusa, compressed ─────────────────────────
// x → east, z → south, y ↑. The player walks north (−z): neon side street → avenue →
// Kaminarimon → Nakamise → Hozomon → temple grounds.
const COL = {
  asphalt: [0.055, 0.055, 0.065], paint: [0.62, 0.62, 0.58], walk: [0.2, 0.19, 0.19], stone: [0.24, 0.22, 0.2],
  verm: [0.66, 0.08, 0.035], vermD: [0.36, 0.045, 0.025], roof: [0.17, 0.19, 0.24], roofCap: [0.08, 0.08, 0.1],
  black: [0.025, 0.022, 0.022], lantern: [0.9, 0.12, 0.05], gold: [0.75, 0.55, 0.18], concrete: [0.15, 0.15, 0.17],
  concreteW: [0.2, 0.18, 0.17], wood: [0.28, 0.17, 0.09], woodD: [0.14, 0.08, 0.05], plaster: [0.55, 0.52, 0.46],
  ginkgo: [0.85, 0.66, 0.08], maple: [0.85, 0.16, 0.05], pine: [0.08, 0.2, 0.1], skin: [0.6, 0.45, 0.35],
};

function buildWorld() {
  const M = new Mesh();
  const lights = [], signs = [], decals = [], colliders = [];
  const R = rng(7);
  const o = (c, m, e = 0, p = 0) => ({ c, m, e, p });
  const L = (p, c, r, i, flick = 0) => lights.push({ p, c, r, i, base: i, flick });
  const solid = (x0, z0, x1, z1) => colliders.push([Math.min(x0, x1), Math.min(z0, z1), Math.max(x0, x1), Math.max(z0, z1)]);

  // ── ground
  M.ground(-60, 16, 60, 27, 0, o(COL.asphalt, MAT.ASPHALT, 0, PAT.ASPHALT));      // avenue (Kaminarimon-dori)
  M.ground(-60, 27, 60, 31, 0.02, o(COL.walk, MAT.STONE, 0, PAT.PAVING));         // south sidewalk
  M.ground(-60, 3, 60, 16, 0.02, o(COL.walk, MAT.STONE, 0, PAT.PAVING));          // north sidewalk / gate forecourt
  M.ground(-3, 31, 3, 72, 0, o(COL.asphalt, MAT.ASPHALT, 0, PAT.ASPHALT));        // neon side street
  M.ground(-4.6, 31, -3, 72, 0.04, o(COL.walk, MAT.STONE, 0, PAT.PAVING));
  M.ground(3, 31, 4.6, 72, 0.04, o(COL.walk, MAT.STONE, 0, PAT.PAVING));
  M.ground(-4, -34.5, 4, 3, 0.03, o(COL.stone, MAT.STONE, 0, PAT.PAVING));         // Nakamise path
  // curbs
  M.box(-60, 0, 26.85, 60, 0.12, 27.05, o(COL.stone, MAT.STONE));
  M.box(-60, 0, 15.95, 60, 0.12, 16.15, o(COL.stone, MAT.STONE));
  // lane markings: dashed centre line, side-street edge lines, "止まれ"-style stop bar
  for (let x = -58; x < 58; x += 4) if (Math.abs(x + 1) > 5) M.box(x, 0.005, 21.45, x + 2.2, 0.012, 21.6, o(COL.paint, MAT.ASPHALT));
  for (const x of [-2.75, 2.65]) M.box(x, 0.005, 31.5, x + 0.1, 0.012, 72, o(COL.paint, MAT.ASPHALT));
  M.box(-2.6, 0.005, 32.2, 2.6, 0.012, 32.6, o(COL.paint, MAT.ASPHALT));
  // zebra crossing: bars parallel to the walking direction
  for (let x = -3.2; x <= 3.2; x += 0.9) M.box(x - 0.24, 0.005, 16.6, x + 0.24, 0.014, 26.4, o(COL.paint, MAT.ASPHALT, 0.02));

  // ── street lamps (avenue)
  for (const x of [-30, -18, -8, 8, 18, 30]) for (const z of [15.4, 27.6]) {
    M.cyl(x, 0, z, 0.08, 5.2, 6, o([0.12, 0.12, 0.13], MAT.METAL));
    M.box(x - 0.6, 5.1, z - 0.12, x + 0.6, 5.25, z + 0.12, o([0.12, 0.12, 0.13], MAT.METAL));
    M.cbox(x, 4.95, z, 0.9, 0.16, 0.3, o([1, 0.8, 0.55], MAT.PAPER, 1));
    L([x, 4.6, z], [1, 0.72, 0.45], 13, 1.3);
  }
  // pedestrian signals
  for (const [x, z, s] of [[-4.2, 15.6, 1], [4.2, 27.4, -1]]) {
    M.cyl(x, 0, z, 0.07, 3, 6, o([0.15, 0.15, 0.16], MAT.METAL));
    M.cbox(x, 2.3, z, 0.4, 0.7, 0.3, o([0.05, 0.05, 0.05], MAT.METAL));
    M.cbox(x, 2.35, z + 0.16 * s, 0.26, 0.26, 0.04, o([0.1, 1, 0.6], MAT.NEON, 1));
    L([x, 2.4, z + 0.4 * s], [0.1, 1, 0.6], 4, 0.6);
  }

  // ── modern block: towers south of the avenue, a narrow neon side street between them
  const neonCols = [[1, 0.25, 0.55], [0.2, 0.9, 1], [1, 0.62, 0.15], [0.7, 0.35, 1], [0.3, 1, 0.45], [1, 0.9, 0.3]];
  function tower(x0, z0, x1, z1, h) {
    M.box(x0, 0, z0, x1, h, z1, o(R() > 0.5 ? COL.concrete : COL.concreteW, MAT.FACADE, 0, PAT.WINDOWS));
    M.box(x0 + 0.5, h, z0 + 0.5, x0 + 2.2, h + 1.6, z0 + 2, o([0.12, 0.12, 0.13], MAT.METAL));
    if (R() > 0.4) M.cyl((x0 + x1) / 2 + 1, h, (z0 + z1) / 2, 0.9, 2.2, 7, o([0.14, 0.14, 0.15], MAT.METAL));
    solid(x0, z0, x1, z1);
  }
  const blocks = [
    [-12, 31, -4.6, 38, 14], [-12, 38, -4.6, 45, 23], [-12, 45, -4.6, 53, 11], [-12, 53, -4.6, 61, 17], [-12, 61, -4.6, 72, 26],
    [4.6, 31, 11, 39, 10], [4.6, 39, 12, 46, 19], [4.6, 46, 11, 55, 13], [4.6, 55, 12, 63, 21], [4.6, 63, 12, 72, 15],
    [-24, 31, -12, 40, 18], [-34, 31, -24, 39, 12], [-46, 31, -34, 40, 21], [-60, 31, -46, 38, 15],
    [12, 31, 23, 40, 16], [23, 31, 35, 38, 24], [35, 31, 47, 40, 13], [47, 31, 60, 39, 19],
  ];
  blocks.forEach(b => tower(b[0], b[1], b[2], b[3], b[4]));
  // avenue-facing shop fronts
  blocks.forEach((b, i) => {
    const [x0, z0, x1] = b, nc = neonCols[i % neonCols.length];
    M.box(x0 + 0.4, 0.1, z0 - 0.06, x1 - 0.4, 2.8, z0, o([nc[0] * 0.5 + 0.35, nc[1] * 0.5 + 0.35, nc[2] * 0.5 + 0.35], MAT.GLASS, 0.45, PAT.SHOJI), 'z');
    M.box(x0 + 0.2, 2.9, z0 - 0.9, x1 - 0.2, 3.1, z0, o([0.08, 0.08, 0.09], MAT.METAL));
    L([(x0 + x1) / 2, 2.2, z0 - 1.5], [nc[0] * 0.6 + 0.4, nc[1] * 0.6 + 0.4, nc[2] * 0.6 + 0.4], 7, 0.55);
  });
  // side-street shop fronts: every few metres a lit doorway, noren, a light pool on the street
  const fronts = [
    // [side, z0, z1, colour, kind]
    [-1, 38.5, 44.5, [1, 0.6, 0.3], 'izakaya'], [-1, 45.5, 52.5, [1, 0.35, 0.5], 'bar'], [-1, 53.5, 60.5, [0.5, 0.8, 1], 'cafe'], [-1, 61.5, 70, [1, 0.75, 0.4], 'ramen'],
    [1, 39.5, 45.5, [0.8, 0.5, 1], 'karaoke'], [1, 46.5, 54.5, [1, 0.55, 0.25], 'yakitori'], [1, 55.5, 62.5, [0.4, 1, 0.7], 'game'], [1, 63.5, 71, [1, 0.85, 0.5], 'sushi'],
  ];
  for (const [side, z0, z1, c, kind] of fronts) {
    const x = side * 4.6;
    M.box(Math.min(x, x - side * 0.05), 0.1, z0, Math.max(x, x - side * 0.05), 2.7, z1, o([c[0] * 0.6 + 0.3, c[1] * 0.6 + 0.3, c[2] * 0.6 + 0.3], MAT.GLASS, 0.55, kind === 'game' ? PAT.DRINKS : PAT.SHOJI), side > 0 ? 'x' : 'X');
    M.box(Math.min(x, x - side * 0.8), 2.75, z0, Math.max(x, x - side * 0.8), 2.95, z1, o([0.06, 0.06, 0.07], MAT.METAL));

  // ── temple grounds (Hozomon → Senso-ji → pagoda → pond) live in 81_temple.js
  const trees = [[-26, 0, 14.2, 0], [-14, 0, 14.2, 0], [14, 0, 14.2, 0], [26, 0, 14.2, 0]];   // [x, y, z, 0 ginkgo | 1 maple]

// ───────────────────────── temple grounds: Hozomon → Senso-ji → pagoda → pond ─────────────────────────
// Everything north of the Nakamise (z < −34). The follow camera sits 13.5 m up and the top edge of the
// view dips 3.4° below the horizon, so nothing higher than ≈ 11–12 m is ever seen directly: the upper
// tiers of the pagoda and the hall's ridge only exist in reflections. A reflection of height H at z_o lands
// on the water at z_w = (H·z_c + 13.5·z_o) / (H + 13.5) (z_c = camera z = player z + 10.5), so the whole
// 25 m pagoda, silhouetted against the mirrored starry sky, needs water reaching ~13 m south of it: hence
// the long reflecting pool in front of it (the big pond is far too east to ever mirror it).
// Any surface at y ≥ −0.02 is also drawn in the mirror pass and would hide what is reflected behind it,
// so water and all walkable ground sit a few cm below 0.
const POND = { cx: 21, cz: -62, rx: 8, rz: 11 };
const GARDEN_POOL = { cx: -17.75, cz: -46.2, rx: 4.3, rz: 7.4, p: 4 };
const ISLET = { cx: 24.6, cz: -55.4, rx: 2.3, rz: 1.5 };              // nakajima in the south-east of the pond    // superellipse |u|^p + |v|^p < 1
function isWater(x, z) {
  const G = GARDEN_POOL;
  return (((x - POND.cx) / POND.rx) ** 2 + ((z - POND.cz) / POND.rz) ** 2 < 1 && ((x - ISLET.cx) / ISLET.rx) ** 2 + ((z - ISLET.cz) / ISLET.rz) ** 2 > 1)
    || Math.abs((x - G.cx) / G.rx) ** G.p + Math.abs((z - G.cz) / G.rz) ** G.p < 1;
}
function bridgeY(x, z) { return (x > 12 && x < 30 && Math.abs(z + 62) < 0.8) ? 1.4 * Math.sin(Math.PI * (x - 12) / 18) : 0; }

function buildTemple(M, k) {
  const { o, L, solid, signs, decals, wires, trees, anchors, R, COL } = k;
  const V = V3, TAU = Math.PI * 2;
  // temple palette on top of the world palette
  const C = {
    verm: COL.verm, vermD: COL.vermD, roof: COL.roof, cap: COL.roofCap, black: COL.black, gold: COL.gold,
    wood: COL.wood, woodD: COL.woodD, plaster: COL.plaster, white: [0.74, 0.71, 0.64], lantern: COL.lantern,
    stone: COL.stone, stoneL: [0.36, 0.34, 0.31], stoneD: [0.15, 0.14, 0.13], gravel: [0.25, 0.23, 0.2],
    bronze: [0.2, 0.4, 0.33], bronzeD: [0.1, 0.18, 0.15], straw: [0.66, 0.53, 0.3], grass: [0.06, 0.14, 0.05],
    bark: [0.12, 0.08, 0.06], ridge: [0.3, 0.32, 0.38],
  };
  const WARM = [1, 0.56, 0.26], RED = [1, 0.32, 0.12], EMBER = [1, 0.42, 0.12], FLOOD = [1, 0.6, 0.32];
  const tiles = o([0.25, 0.27, 0.34], MAT.ROOF, 0.06, PAT.TILES);   // faint moonlit sheen: the south slopes face away from the moon
  const pillar = o(C.verm, MAT.WOOD, 0, PAT.PLANKS);           // upright lacquer → | strokes
  const lac = o(C.verm, MAT.METAL), lacD = o(C.vermD, MAT.METAL); // horizontal lacquer beams → - = strokes
  const gold = o(C.gold, MAT.METAL, 0.25), blackM = o([0.04, 0.035, 0.03], MAT.METAL);
  const pave = o(C.stone, MAT.STONE, 0, PAT.PAVING);
  const bark = o(C.bark, MAT.WOOD);
  const v0 = M.count;

  // ───────── helpers ─────────
  // prism between two points with a w×h cross-section (rails, sloped beams)
  function beam(a, b, w, h, opt) {
    const d = V.sub(b, a), s = V.mul(V.norm([-d[2], 0, d[0]]), w / 2), u = [0, h / 2, 0];
    const p = (q, ss, uu) => V.add(V.add(q, V.mul(s, ss)), V.mul(u, uu));
    M.quadF(p(a, 1, 1), p(b, 1, 1), p(b, -1, 1), p(a, -1, 1), opt, [0, 1, 0]);
    M.quadF(p(a, 1, -1), p(b, 1, -1), p(b, -1, -1), p(a, -1, -1), opt, [0, -1, 0]);
    M.quadF(p(a, 1, -1), p(b, 1, -1), p(b, 1, 1), p(a, 1, 1), opt, s);
    M.quadF(p(a, -1, -1), p(b, -1, -1), p(b, -1, 1), p(a, -1, 1), opt, V.mul(s, -1));
  }
  // tapered n-gon tube between two points (limbs, legs)
  function tube(a, b, r0, r1, opt, seg = 5) {
    const d = V.norm(V.sub(b, a)), ref = Math.abs(d[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    const u = V.norm(V.cross(d, ref)), w = V.cross(d, u);
    const q = (ang, r, p) => V.add(p, V.add(V.mul(u, Math.cos(ang) * r), V.mul(w, Math.sin(ang) * r)));
    for (let i = 0; i < seg; i++) {
      const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU, am = (a0 + a1) / 2;
      M.quad(q(a0, r0, a), q(a1, r0, a), q(a1, r1, b), q(a0, r1, b), opt, V.add(V.mul(u, Math.cos(am)), V.mul(w, Math.sin(am))));

  const skin = o3([0.75, 0.55, 0.42], MAT.CLOTH), hair = o3([0.03, 0.03, 0.04], MAT.CLOTH);
  // legs
  for (const side of [-1, 1]) {
    M.push(M4.mul(M4.trans(side * 0.11, 0.86 + bob, 0), M4.rotX(sw * side)));
    M.box(-0.08, -0.86, -0.09, 0.08, 0, 0.09, pants);

  // arms

// ───────────────────────── UI: title, cards, dialog, omikuji, HUD, controls ─────────────────────────
// Everything here writes printable ASCII into the overlay grid (ov.put); no DOM, no state outside `UI`.
// Two drawing idioms:
//  - floating text (title, cards, HUD, end): flags-1 glyphs over a dithered "ink wash" of flags-3 dark cells,
//  - panels (dialog, omikuji, prompt, button): every cell flags 3. The renderer derives a flags-2 cell's
//    background from its own glyph colour (bg = col * 0.1), so a panel is filled with spaces of the same hue
//    as its text; that keeps the panel background even behind letters.
// Signature transition: `scramble` (letters cycle through random glyphs, staggered left to right, then settle).
const UI = (() => {
  // ── palette
  const PAPER = [0.92, 0.88, 0.8], VERM = [1, 0.34, 0.2], GOLD = [1, 0.78, 0.38], DIM = [0.5, 0.52, 0.65];
  const SOFT = [0.72, 0.72, 0.8];        // secondary text that must survive the corner vignette
  const INK = [0.1, 0.09, 0.17];         // wash cells: background = INK * 0.1, a night-blue black
  const WARM = [1, 0.86, 0.62];          // omikuji paper fill (warm), close to PAPER and GOLD text
  const SAFE = { top: 2, bottom: 3, side: 2 };

  // ── small helpers
  const c01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const clampI = (x, a, b) => x < a ? a : x > b ? b : x;
  const ease = x => 1 - Math.pow(1 - c01(x), 3);
  const sstep = (a, b, x) => { const k = c01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  const mul = (c, a) => [c[0] * a, c[1] * a, c[2] * a];
  const mix = (p, q, k) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k, p[2] + (q[2] - p[2]) * k];
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
  const bayer = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];
  const maxLen = a => a.reduce((m, s) => Math.max(m, s.length), 0);
  const spaced = s => String(s).split(' ').filter(Boolean).map(w => w.split('').join(' ')).join('   ');
  const centreX = (ov, s) => Math.floor((ov.cols - s.length) / 2);

  // one glyph, colour scaled by alpha
  function put(ov, x, y, ch, col, a = 1, flags = 1, glow = 0) {
    if (a <= 0.004) return;
    ov.put(x, y, ch, a === 1 ? col : mul(col, a), 0, flags, glow * a);
  }
  function text(ov, x, y, s, col, a = 1, flags = 1, glow = 0) {
    if (a <= 0.004) return;
    const c = a === 1 ? col : mul(col, a);
    x = Math.round(x); y = Math.round(y);
    for (let i = 0; i < s.length; i++) ov.put(x + i, y, s[i], c, 0, flags, glow * a);
  }
  // panel cell: while fading (a < 1) cells appear through an ordered dither instead of a hard pop
  function cell(ov, x, y, ch, col, a, glow = 0) {
    if (a <= 0.004 || (a < 1 && a <= bayer(x, y))) return;
    ov.put(x, y, ch, col, 0, 3, glow);
  }

  // ── word wrap: paragraphs split on '\n', long words hard-broken
  function wrap(str, w) {
    w = Math.max(4, w | 0);
    const out = [];
    for (const para of String(str).split('\n')) {
      let line = '';
      for (let word of para.split(/\s+/)) {
        if (!word) continue;
        while (word.length > w) { if (line) { out.push(line); line = ''; } out.push(word.slice(0, w)); word = word.slice(w); }
        if (!line) line = word;
        else if (line.length + 1 + word.length <= w) line += ' ' + word;
        else { out.push(line); line = word; }
      }
      out.push(line);
    }
    return out;
  }
  // same line count as wrap(), but lines of even length (for centred text)
  function wrapBal(str, w) {
    let best = wrap(str, w);
    if (best.length < 2) return best;
    for (let ww = (w | 0) - 1; ww >= 8; ww--) {
      const l = wrap(str, ww);
      if (l.length > best.length || l.some(s => s.length > ww)) break;
      best = l;
    }
    return best;
  }

  // ── scramble: each letter cycles through random glyphs, staggered left to right, then settles
  const POOL_UP = 'ABCDEFGHJKMNPRSTUVWXYZ#%&*+=<>/\\|', POOL_LO = 'abcdefghjkmnpqrstuvwxyz+=~:;', POOL_DG = '0123456789#', POOL_SY = '.:;-=+*#%/\\|<>~^';
  function rchar(c, i, k) {
    const o = c.charCodeAt(0);
    const p = o >= 65 && o <= 90 ? POOL_UP : o >= 97 && o <= 122 ? POOL_LO : o >= 48 && o <= 57 ? POOL_DG : POOL_SY;
    return p[Math.floor(hash(i * 13.37 + k * 7.91) * p.length) % p.length];
  }
  const stagOf = n => Math.min(0.04, 0.6 / Math.max(1, n));
  function scramble(str, t, t0, speed = 1) {
    str = String(str);
    const n = str.length, el = (t - t0) * (speed || 1), stag = stagOf(n);
    if (el >= (n - 1) * stag + 0.45) return str;
    const k = Math.floor(t * 22);
    let out = '';
    for (let i = 0; i < n; i++) {
      const c = str[i];
      if (c === ' ') { out += ' '; continue; }
      const s = i * stag, e = s + 0.22 + 0.22 * hash(i * 3.1 + n * 0.7);
      out += el < s ? ' ' : el >= e ? c : rchar(c, i, k);
    }
    return out;
  }
  // the reverse: letters break up into noise, then vanish (left to right)
  function unscramble(str, t, t1, speed = 1) {
    str = String(str);
    const n = str.length, el = (t - t1) * (speed || 1), stag = stagOf(n) * 0.7;
    if (el <= 0) return str;
    const k = Math.floor(t * 22);
    let out = '';
    for (let i = 0; i < n; i++) {
      const c = str[i];
      if (c === ' ') { out += ' '; continue; }
      const s = i * stag, e = s + 0.16 + 0.12 * hash(i * 5.7 + n);
      out += el < s ? c : el >= e ? ' ' : rchar(c, i, k);
    }
    return out;
  }

  // ── ink wash: dark cells in a rounded rectangle, edges dithered over `m` columns
  function wash(ov, x0, y0, w, h, a, m = 5) {
    if (a <= 0.01) return;
    const my = Math.max(1, Math.round(m * 0.55));
    for (let y = y0 - my; y < y0 + h + my; y++) {
      if (y < 0 || y >= ov.rows) continue;
      const dy = y < y0 ? (y0 - y) / (my + 1) : y >= y0 + h ? (y - (y0 + h - 1)) / (my + 1) : 0;
      for (let x = x0 - m; x < x0 + w + m; x++) {
        if (x < 0 || x >= ov.cols) continue;
        const dx = x < x0 ? (x0 - x) / (m + 1) : x >= x0 + w ? (x - (x0 + w - 1)) / (m + 1) : 0;
        const k = (1 - Math.sqrt(dx * dx + dy * dy)) * a;
        if (k > bayer(x, y)) ov.put(x, y, 32, INK, 0, 3, 0);
      }
    }
  }

  // thin rule with a vermilion knot in the middle; `grow` 0..1 draws it outward from the centre
  function rule(ov, y, w, a, grow = 1, ch = '-', col = DIM, knot = '<>') {
    const C = ov.cols, x0 = Math.floor((C - w) / 2), mid = x0 + w / 2, half = (w / 2) * c01(grow);
    for (let i = 0; i < w; i++) {
      const x = x0 + i;
      if (Math.abs(x + 0.5 - mid) > half) continue;
      put(ov, x, y, ch, col, a);
    }
    if (knot && grow > 0.05) text(ov, Math.floor(mid - knot.length / 2), y, knot, VERM, a * c01(grow * 3), 1, 0.5);
  }

  function drawFortune(rand) {
    const R = typeof rand === 'function' ? rand : Math.random;
    const tbl = TEXT.fortunes, total = tbl.reduce((s, f) => s + f.weight, 0);
    let r = R() * total, f = tbl[tbl.length - 1];
    for (const e of tbl) { if (r < e.weight) { f = e; break; } r -= e.weight; }
    const set = f.sets[Math.floor(R() * f.sets.length) % f.sets.length];
    return { rank: f.rank, reading: f.reading, meaning: f.meaning, verse: set.verse, lines: set.lines.slice(), kyo: f.kyo, no: set.no };
  }

    if (Array.isArray(d[0])) return d[Math.floor((rand || Math.random)() * d.length) % d.length].slice();
    return d.slice();
  }

  // ─────────────────────────────── location card ───────────────────────────────
  const CARD_DUR = 3.6;
  function card(ov, t, c) {
    const el = t - (c.t0 || 0);
    if (el < 0) return true;
    if (el >= CARD_DUR) return false;
    const C = ov.cols, R = ov.rows;
    let ttl = spaced(c.title);
    if (ttl.length > C - 6) ttl = String(c.title);
    const subs = c.sub ? wrapBal(c.sub, Math.min(C - 8, 56)) : [];
    const y0 = Math.max(SAFE.top + 7, Math.round(R * 0.12));
    const tOut = CARD_DUR - 0.8, fade = 1 - sstep(tOut + 0.15, CARD_DUR, el);
    const ww = Math.max(ttl.length, maxLen(subs)) + 6;
    wash(ov, Math.floor((C - ww) / 2), y0 - 1, ww, 4 + subs.length, sstep(0, 0.35, el) * fade, 7);
    const s = el < tOut ? scramble(ttl, t, c.t0 + 0.05) : unscramble(ttl, t, c.t0 + tOut);
    text(ov, centreX(ov, ttl), y0, s, PAPER, 1, 1, 0.4);
    const rw = Math.min(C - 8, Math.max(ttl.length + 8, 22));
    rule(ov, y0 + 1, rw, fade, ease((el - 0.25) / 0.55) * (0.4 + 0.6 * fade), '-', DIM, '<>');
    const sa = sstep(0.75, 1.25, el) * fade;
    subs.forEach((l, i) => text(ov, centreX(ov, l), y0 + 2 + i, l, SOFT, sa));

    if (Math.floor(player.walk / Math.PI) !== Math.floor(ph0 / Math.PI) && speed > 0.8) AU.step(surfaceAt(player.x, player.z, rend.params.rain));
    player.y = onBridge(player.x, player.z) ? bridgeY(player.x, player.z) : 0;

    // ── weather: rain over the city, easing as you reach the temple (unless toggled)
    const autoRain = player.z > 8 ? 0.5 : player.z > -30 ? 0.5 * (player.z + 30) / 38 : 0;
    const rainT = GS.rainManual !== null ? GS.rainManual : autoRain;
    rend.params.rain = damp(rend.params.rain, rainT, 0.8, dt);
    rend.params.wet = 0.35 + rend.params.rain * 0.8;
    // lightning while it pours: the Thunder Gate earns its name
    if (rend.params.rain > 0.3 && GS.state === 'play') { boltT -= dt; if (boltT < 0) { boltT = 18 + Math.random() * 22; GS.flash = 1; GS.flashCol = [0.72, 0.78, 1]; GS.bolt = t; setTimeout(() => sfx('thunder', { vol: 0.8 }), 1200 + Math.random() * 1500); } }
    GS.flash = Math.max(0, GS.flash - dt * (GS.bolt && t - GS.bolt < 0.6 ? 3.5 : 1.5));
    const fl = GS.flash * (GS.calm ? 0.4 : GS.bolt && t - GS.bolt < 0.6 ? (0.55 + 0.45 * Math.sign(Math.sin(t * 47))) : 1);
    for (let i = 0; i < 3; i++) { rend.ambTop[i] = ambTop[i] + GS.flashCol[i] * fl * 0.6; rend.ambBot[i] = ambBot[i] + GS.flashCol[i] * fl * 0.25; rend.fogC[i] = fogBase[i] + GS.flashCol[i] * fl * 0.12; }

    // ── cat
    {
      let tx = cat.tx, tz = cat.tz;
      if (cat.follow) { const d = Math.hypot(player.x - cat.x, player.z - cat.z); if (d > 2.2) { tx = player.x + 0.9; tz = player.z + 1.1; } else { tx = cat.x; tz = cat.z; } }
      else { cat.idle -= dt; if (cat.idle < 0) { cat.idle = 3 + Math.random() * 5; cat.tx = -2.6 + (Math.random() - 0.5) * 4; cat.tz = -31 - Math.random() * 4; } tx = cat.tx; tz = cat.tz; }
      const dx = tx - cat.x, dz = tz - cat.z, d = Math.hypot(dx, dz), csp = Math.min(cat.follow ? 5.2 : 1.2, d * 2);
      if (d > 0.15) { const vx = dx / d * csp, vz = dz / d * csp; if (!blocked(cat.x + vx * dt, cat.z + vz * dt)) { cat.x += vx * dt; cat.z += vz * dt; } cat.face = Math.atan2(vx, vz); }
      cat.amp = damp(cat.amp, d > 0.15 ? Math.min(1, csp / 2) : 0, 6, dt); cat.walk += csp * dt * 5;
    }
    // ── koi wander inside the water; feeding pulls them in
    const calling = GS.koiCall && t < GS.koiCall[2];
    for (const k of koi) {
      k.a += Math.sin(t * 0.7 + k.sp * 9) * 0.6 * dt;
      if (calling) { const want = Math.atan2(GS.koiCall[1] - k.z, GS.koiCall[0] - k.x); k.a += Math.atan2(Math.sin(want - k.a), Math.cos(want - k.a)) * dt * 2.2; }
      const v = k.sp * (calling ? 1.8 : 1);
      const nx2 = k.x + Math.cos(k.a) * v * dt, nz2 = k.z + Math.sin(k.a) * v * dt;
      if (isWater(nx2, nz2) && isWater(nx2 + Math.cos(k.a) * 0.8, nz2 + Math.sin(k.a) * 0.8)) { k.x = nx2; k.z = nz2; } else k.a += 2.4 * dt + 0.2;
      if (Math.random() < dt * 0.02) { fx.addRipple(k.x, k.z, 0.5); if (Math.hypot(k.x - player.x, k.z - player.z) < 10) sfx('splash', { x: k.x, z: k.z, vol: 0.4 }); }
    }
    // ── floating lanterns drift
    for (const f of floaters) {
      f.vx += (Math.sin(t * 0.21 + f.ph) * 0.04 - f.vx * 0.15) * dt; f.vz += (Math.cos(t * 0.17 + f.ph * 1.7) * 0.04 - f.vz * 0.15) * dt;
      const nx3 = f.x + f.vx * dt, nz3 = f.z + f.vz * dt;
      if (isWater(nx3, nz3) && !(Math.abs(nz3 + 62) < 1.4 && nx3 > 12 && nx3 < 30)) { f.x = nx3; f.z = nz3; } else { f.vx = -f.vx; f.vz = -f.vz; }
    }

    // ── camera: follow (behind/above, looking north), title drift, or the finale's view across the pond
    const look = [player.x + player.vx * 0.35, 1 + player.y * 0.6, player.z - 9 + player.vz * 0.45];
    camT = [damp(camT[0], look[0], 3, dt), damp(camT[1], look[1], 3, dt), damp(camT[2], look[2], 3, dt)];
    const sway = GS.calm ? [0, 0, 0] : [Math.sin(t * 0.13) * 0.5, Math.sin(t * 0.21) * 0.25, 0];
    let cpos, ctgt;
    if (GS.state === 'title' || GS.state === 'intro') {
      const k = GS.state === 'intro' ? smooth(0, 1.2, t - GS.introT0) : 0;
      const tp = [player.x, 1, player.z - 9], cp = [tp[0] + sway[0], tp[1] + 12.5 + sway[1], tp[2] + 19.5];
      const tt = [Math.sin(t * 0.07) * 1.5, 8.5, player.z - 44], ct = [Math.sin(t * 0.07) * 1.5 + 0.5, 3.0, player.z - 3.5];
      ctgt = V3.lerp(tt, tp, k); cpos = V3.lerp(ct, cp, k);
    } else {
      ctgt = camT.slice(); cpos = [camT[0] + sway[0], camT[1] + 12.5 + sway[1], camT[2] + 19.5];
    }
    GS.lookK = damp(GS.lookK || 0, GS.lookCam ? 1 : 0, 1.6, dt);
    if (GS.lookCam) GS.lastLook = GS.lookCam;
    if (GS.lookK > 0.001 && GS.lastLook) {
      const lk = smooth(0, 1, GS.lookK);
      cpos = V3.lerp(cpos, V3.add(GS.lastLook.pos, [Math.sin(t * 0.3) * 0.3, 0, 0]), lk); ctgt = V3.lerp(ctgt, GS.lastLook.tgt, lk);
    }
    if (GS.finale) {
      GS.finale.k = damp(GS.finale.k, cine ? 1 : 0, 0.9, dt);
      const fk = smooth(0, 1, GS.finale.k);
      const sp0 = [14.6 + Math.sin(t * 0.2) * 0.6, 8, -45.2], st0 = V3.add(sp0, [SKY_DIR[0] * 30, 1.2, SKY_DIR[2] * 30]);
      cpos = V3.lerp(cpos, sp0, fk); ctgt = V3.lerp(ctgt, st0, fk);
      if (t > GS.finale.next) { launch(cine ? 1 : 0.55); GS.finale.next = t + (cine ? 0.6 + Math.random() * 1.2 : 4 + Math.random() * 6); }
    }
    rend.setCamera(cpos, ctgt, 1.02);
    rend.occ = (GS.state === 'play' && !cine && GS.lookK < 0.3) ? [player.x, 1.3 + player.y, player.z, 2.3] : [0, 0, 0, 0];

    // ── lights
    const showDim = GS.finale ? 1 - 0.62 * smooth(0, 1, GS.finale.k) : 1;   // the precinct dims for the show
    for (const l of world.lights) l.i = showDim * l.base * (1 - l.flick * (0.5 + 0.5 * Math.sin(t * 13 + l.p[0] * 3) * Math.sin(t * 7.7 + l.p[2])));
    const dynL = [{ p: [player.x + 0.42 * Math.sin(player.face - 1.57), 0.9 + player.y, player.z + 0.42 * Math.cos(player.face - 1.57)], c: [1, 0.6, 0.25], r: 6, i: 1.15 * (0.92 + 0.08 * Math.sin(t * 17)) }];
    for (const f of floaters) dynL.push({ p: [f.x, 0.6, f.z], c: [1, 0.6, 0.3], r: 4, i: 0.75 });
    if (GS.smokeBoost) GS.smokeBoost = Math.max(0, GS.smokeBoost - dt * 0.5);
    rend.setLights(world.lights.concat(dynL));

    // ── dynamic meshes
    const gl = rend.gl, putMesh = (obj, M, model) => { gl.bindBuffer(gl.ARRAY_BUFFER, obj.vbo); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(M.d), gl.DYNAMIC_DRAW); obj.count = M.count; obj.model = model; };
    { const M = new Mesh(); buildPlayer(M, { walk: player.walk, amp: player.amp, umbrella: rend.params.rain > 0.12 ? 1 : 0, lantern: true }); putMesh(playerObj, M, M4.mul(M4.trans(player.x, player.y, player.z), M4.rotY(player.face))); }
    { const M = new Mesh(); buildCat(M, { walk: cat.walk, amp: cat.amp, t }); putMesh(catObj, M, M4.mul(M4.trans(cat.x, 0, cat.z), M4.rotY(cat.face))); }
    { const M = new Mesh(); buildFloaters(M, floaters, t); putMesh(floatObj, M, M4.ident()); }

    // ── particles
    fx.update(dt, t, { center: [player.x, 0, player.z], rain: rend.params.rain, leaves: rend.params.rain > 0.3 ? 0.3 : 1, trees: world.trees, wind: -0.4, isWater });
    if (A.smoke) fx.smoke(A.smoke, 7 + (GS.smokeBoost || 0) * 10, dt, GS.smokeBoost > 0.5 ? [player.x, 1.5, player.z] : null);
    fx.writeRipples(rend.rip);

    // ── zones: location cards and ambient cues
    const zone = zoneOf(player.x, player.z);
    if (GS.state === 'play' && zone !== lastZone && !GS.busy) {
      lastZone = zone;
      if (!GS.seen['card_' + zone]) {
        GS.seen['card_' + zone] = 1;
        const c = UI.TEXT.cards[zone]; if (c) { GS.card = { title: c.title, sub: c.sub, t0: t }; sfx('gate'); }
        if ((zone === 'temple' || zone === 'pagoda' || zone === 'pond') && !GS.seen.templeTale) { GS.seen.templeTale = 1; run(async () => { await wait(3.4); await say(UI.lines('temple')); }); }
      }
    }
    if (zone === 'avenue' && GS.state === 'play') { crossT -= dt; if (crossT < 0) { crossT = 7; sfx('crossing', { x: 0, z: 21 }); } } else crossT = 0.5;
    if (!GS.seen.door && player.x > 2 && player.z > 32 && player.z < 37) { GS.seen.door = 1; sfx('door', { x: 4.6, z: 34.5 }); }

    // ── audio mix
    const pondNear = 1 - Math.min(1, Math.hypot((player.x - POND.cx) / (POND.rx + 8), (player.z - POND.cz) / (POND.rz + 8)));
    const basinNear = 1 - Math.min(1, Math.hypot(player.x - A.temizu[0], player.z - A.temizu[2] + 2) / 6);
    AU.update(dt, { zone: smooth(10, -14, player.z), rain: rend.params.rain, water: clamp(Math.max(pondNear * 1.4, basinNear), 0, 1), crowd: player.z > 31 ? 0.5 : 0.1, festival: GS.finale ? (cine ? 1 : 0.3) : 0, px: player.x, pz: player.z });

    // ── overlay: world text, particles, koi, name tag, then UI
    ov.clear();
    drawWires(ov, rend, world.wires);
    ui.clear();
    drawSigns(ui, rend, world.signs, t);
    for (const d of world.decals) drawDecal(ov, rend, d);
    fx.draw(ov, rend, t);
    for (const k of koi) {
      const s = rend.project([k.x, -0.1, k.z]); if (!s || s.d > 0.4) continue;
      const right = Math.cos(k.a) > 0, str = right ? '><>' : '<><', x0 = Math.round(s.x) - 1;
      for (let i = 0; i < 3; i++) ov.put(x0 + i, s.y, str[i], k.col.map(v => v * (i === (right ? 2 : 0) ? 0.85 : 0.65)), 0, 5, 0.12);
    }
    if (GS.state === 'play' && !cine && GS.lookK < 0.2) {
      const head = rend.project([player.x, 2.75 + player.y, player.z]);
      if (head) ui.text(Math.round(head.x / 2 - 4), Math.round(head.y / 2), 'tabibito', [0.58, 0.58, 0.64], 0, 1, 0.05);
    }

    // ── UI
    if (GS.state === 'title' || (GS.state === 'intro' && t - GS.introT0 < 1.2)) {
      const a = GS.state === 'title' ? smooth(0.8, 2.6, t) : 1 - smooth(0, 1, t - GS.introT0);
      UI.title(ui, t, a, 0.9);
    }
    if (GS.state === 'play') {
      if (!cine) {
        GS.hudRects = UI.hud(ui, { rituals: UI.TEXT.rituals.map((l, i) => ({ label: l, done: GS.rituals[i] })), rain: rend.params.rain > 0.15, sound: !AU.isMuted(), t, alpha: 1 });
        const it = !GS.busy && !GS.dialog ? nearest() : null;
        if (it) {
          const s = rend.project(it.id === 'cat' ? [cat.x, 1.0, cat.z] : [it.p[0], 1.6, it.p[2]]);
          if (s) UI.prompt(ui, s.x / 2, s.y / 2, it.label, t, GS.touch ? undefined : 'E');
        }
        GS.btn = GS.touch ? UI.button(ui, { visible: !!it, label: it ? it.label : '', pressed: t - GS.btnPressed < 0.18, t }) : null;
        if (GS.touch && !GS.busy && !GS.dialog) {
          const Lo = UI.layout(ui);
          UI.stick(ui, GS.stick.active ? GS.stick : { active: false, ox: Lo.stick[0], oy: Lo.stick[1], kx: Lo.stick[0], ky: Lo.stick[1] });
        }
      } else { GS.hudRects = null; GS.btn = null; }
      if (GS.card && !UI.card(ui, t, GS.card)) GS.card = null;
    }
    if (GS.dialog) {
      const r = UI.dialog(ui, t, GS.dialog);
      GS.dialog.done = r.done;
      if (r.typed > GS.dialog.typedLast + 1) { GS.dialog.typedLast = r.typed; sfx('blip'); }
    }
    if (GS.fortune) UI.fortune(ui, t, GS.fortune);
    if (GS.ending) UI.end(ui, t, GS.ending.t0);

    const tj = performance.now(); GS.jsMs = damp(GS.jsMs || 0, tj - now, 4, dt);
    rend.render(ov, ui);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
const Game = {};
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;left:16px;right:16px;bottom:16px;color:#f88;font:12px monospace;white-space:pre-wrap">' + String(e.message || e) + '</pre>'); });

</script>
